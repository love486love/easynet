name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Test
        run: go test ./... -count=1 -timeout 120s

      - name: Build GUI
        shell: pwsh
        working-directory: cmd/easynet
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          $wails = Join-Path (go env GOPATH) "bin/wails.exe"
          & $wails build -platform windows/amd64 -webview2 browser -ldflags "-s -w"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item cmd/easynet/build/bin/easynet.exe dist
          Copy-Item README.md dist
          Copy-Item packaging/uninstall.bat dist
          $lines = Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $lines | Out-File dist/checksums.txt -Encoding utf8
          Compress-Archive -Path dist/* -DestinationPath easynet-windows-x64.zip -Force
          (Get-FileHash easynet-windows-x64.zip -Algorithm SHA256).Hash.ToLower() |
            Out-File easynet-windows-x64.zip.sha256 -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver = "$env:GITHUB_REF_NAME".TrimStart('v')
          & $iscc "/DMyAppVersion=$ver" packaging/easynet.iss
          Get-ChildItem dist-installer

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            easynet-windows-x64.zip
            easynet-windows-x64.zip.sha256
            dist-installer/easynet-setup-*.exe
          body_path: docs/RELEASE_NOTES.md
