name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Test
        run: go test ./... -count=1 -timeout 120s

      - name: Build CLI and daemon
        run: |
          go build -ldflags "-s -w" -o epo.exe ./cmd/epo
          go build -ldflags "-s -w -H=windowsgui" -o epo-daemon.exe ./cmd/epo-daemon

      - name: Build GUI
        shell: pwsh
        working-directory: cmd/epo-gui
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          $wails = Join-Path (go env GOPATH) "bin/wails.exe"
          & $wails build -platform windows/amd64 -webview2 browser -ldflags "-s -w"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item epo.exe, epo-daemon.exe dist
          Copy-Item cmd/epo-gui/build/bin/epo-gui.exe dist
          Copy-Item README.md dist
          Copy-Item packaging/uninstall.bat dist
          $lines = Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $lines | Out-File dist/checksums.txt -Encoding utf8
          Compress-Archive -Path dist/* -DestinationPath epo-windows-x64.zip -Force
          (Get-FileHash epo-windows-x64.zip -Algorithm SHA256).Hash.ToLower() |
            Out-File epo-windows-x64.zip.sha256 -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver = "$env:GITHUB_REF_NAME".TrimStart('v')
          & $iscc "/DMyAppVersion=$ver" packaging/epo.iss
          Get-ChildItem dist-installer

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            epo-windows-x64.zip
            epo-windows-x64.zip.sha256
            dist-installer/epo-setup-*.exe
          body: |
            ## 下载哪个包？

            两个包功能完全一样，区别只在安装方式：

            | 包 | 适合谁 | 怎么卸载 |
            |---|---|---|
            | `epo-windows-x64.zip`（绿色版） | 不想安装、想放在任意目录或 U 盘 | 运行目录里的 `uninstall.bat` |
            | `epo-setup-*.exe`（安装版） | 想从「设置 → 应用」正常卸载 | 应用列表卸载，或运行 `unins000.exe` |

            数据都保存在 `%LOCALAPPDATA%\epo`，升级时覆盖 exe 不会丢配置。

            ## 快速开始

            1. 解压 / 安装后打开 `epo-gui.exe`
            2. 「账号」页填写学号、密码、运营商线路
            3. 概览页点「启动守护」
            4. 需要开机自动重连，打开「开机自启」

            ## 已知限制

            - 仅 Windows 10/11 x64，需要系统 WebView2
            - 无代码签名，SmartScreen 会提示「未知发布者」；可核对 `checksums.txt` 或自行构建
            - 无自动更新，升级需手动覆盖
            - 仅适配江西农业大学

            版本：${{ github.ref_name }}
