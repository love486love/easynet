name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Test
        run: go test ./... -count=1 -timeout 120s

      - name: Build GUI
        shell: pwsh
        working-directory: cmd/easynet
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          $wails = Join-Path (go env GOPATH) "bin/wails.exe"
          $ver = "$env:GITHUB_REF_NAME".TrimStart('v')
          & $wails build -platform windows/amd64 -webview2 browser -trimpath -ldflags "-s -w -X main.Version=$ver"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item cmd/easynet/build/bin/easynet.exe dist
          Copy-Item README.md dist
          Copy-Item packaging/uninstall.bat dist
          $lines = Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path $PWD "dist/checksums.txt"),
            $lines,
            (New-Object System.Text.UTF8Encoding($false))
          )
          Compress-Archive -Path dist/* -DestinationPath easynet-windows-x64.zip -Force
          (Get-FileHash easynet-windows-x64.zip -Algorithm SHA256).Hash.ToLower() |
            Out-File easynet-windows-x64.zip.sha256 -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver = "$env:GITHUB_REF_NAME".TrimStart('v')
          & $iscc "/DMyAppVersion=$ver" packaging/easynet.iss
          Get-ChildItem dist-installer

          # 安装包也要进 checksums.txt：安装版更新会据此校验下载结果。
          $setup = Get-ChildItem dist-installer -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw "installer not found" }
          $lines = @(Get-Content -LiteralPath dist/checksums.txt)
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $lines += "$hash  $($setup.Name)"
          [System.IO.File]::WriteAllLines(
            (Join-Path $PWD "dist/checksums.txt"),
            $lines,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            easynet-windows-x64.zip
            easynet-windows-x64.zip.sha256
            dist/easynet.exe
            dist/checksums.txt
            dist-installer/easynet-setup-*.exe
          body_path: docs/RELEASE_NOTES.md
