name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
      - name: format
        run: |
          $files = gofmt -l .
          if ($files) { Write-Error "以下文件未格式化:`n$files"; exit 1 }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
      - name: build
        run: go build -o epo.exe ./cmd/epo
