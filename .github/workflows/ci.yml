name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: format
        run: |
          $files = gofmt -l .
          if ($files) { Write-Error "以下文件未格式化:`n$files"; exit 1 }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -timeout 120s
      - name: build
        run: |
          go build -ldflags "-s -w" -o epo.exe ./cmd/epo
          go build -ldflags "-s -w -H=windowsgui" -o epo-daemon.exe ./cmd/epo-daemon
