<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>epo · 校园网自动认证</title>
<style>
  :root {
    --bg: #0f1216; --card: #171c22; --line: #262d36;
    --text: #e6edf3; --muted: #8b949e; --accent: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .label { color: var(--muted); font-size: 12px; }
  .value { font-size: 15px; margin-top: 4px; word-break: break-all; }
  .state { font-size: 22px; font-weight: 600; }
  .online { color: var(--accent); } .offline { color: var(--bad); } .unknown { color: var(--warn); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
  button {
    background: #21262d; color: var(--text); border: 1px solid var(--line);
    padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  button:hover { border-color: #3d444d; }
  button.primary { background: #238636; border-color: #2ea043; }
  button.primary:hover { background: #2ea043; }
  section { margin-top: 24px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 500; }
  input, select {
    background: #0d1117; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 12px; font-size: 14px; width: 100%;
  }
  .form { display: grid; grid-template-columns: 1fr 1fr 140px auto; gap: 10px; align-items: center; }
  pre {
    background: #0d1117; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; max-height: 320px; overflow: auto; font-size: 12px; color: #adbac7;
  }
  .msg { min-height: 20px; color: var(--muted); }
  .msg.ok { color: var(--accent); } .msg.bad { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <h1>epo</h1>
  <div class="sub">江西农业大学 · 校园网自动认证</div>

  <div class="grid">
    <div class="card">
      <div class="label">当前状态</div>
      <div id="state" class="state unknown">检查中…</div>
      <div id="stateMsg" class="label"></div>
    </div>
    <div class="card"><div class="label">Wi-Fi</div><div id="ssid" class="value">—</div></div>
    <div class="card"><div class="label">本机 IP</div><div id="ipv4" class="value">—</div></div>
    <div class="card"><div class="label">网关</div><div id="gateway" class="value">—</div></div>
    <div class="card"><div class="label">网关 MAC</div><div id="gwmac" class="value">—</div></div>
    <div class="card"><div class="label">凭据 / 信任</div><div id="cred" class="value">—</div></div>
  </div>

  <div class="row">
    <button class="primary" onclick="doLogin()">立即登录</button>
    <button onclick="refresh()">刷新状态</button>
    <button id="autoBtn" onclick="toggleAutostart()">开机自启</button>
  </div>
  <div id="msg" class="msg"></div>

  <section>
    <h2>账号设置</h2>
    <div class="form">
      <input id="user" placeholder="学号">
      <input id="pass" type="password" placeholder="密码">
      <select id="carrier">
        <option value="cmcc">中国移动</option>
        <option value="ctcc">中国电信</option>
        <option value="cucc">中国联通</option>
        <option value="campus">校园线路</option>
      </select>
      <button onclick="saveCred()">保存</button>
    </div>
  </section>

  <section>
    <h2>运行日志</h2>
    <pre id="logs">加载中…</pre>
  </section>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let autostartEnabled = false;

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'X-Epo-Token': TOKEN }, opts.headers || {});
  const res = await fetch(path, opts);
  return res.json();
}

function setMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok === true ? 'ok' : ok === false ? 'bad' : '');
}

function renderState(s) {
  const el = document.getElementById('state');
  el.textContent = s.state === 'online' ? '在线' : s.state === 'offline' ? '未认证' : '未知';
  el.className = 'state ' + (s.state || 'unknown');
  document.getElementById('stateMsg').textContent = s.message || '';
  document.getElementById('ssid').textContent = s.ssid || '—';
  document.getElementById('ipv4').textContent = s.ipv4 || '—';
  document.getElementById('gateway').textContent = s.gateway || '—';
  document.getElementById('gwmac').textContent = s.gateway_mac || '（未取到）';
  document.getElementById('cred').textContent =
    (s.has_cred ? '已保存' : '未保存') + ' / ' + (s.has_trust ? '已信任网关' : '未记录');
}

async function refresh() {
  try {
    const s = await api('/api/status');
    renderState(s);
  } catch (e) {
    setMsg('刷新失败: ' + e, false);
  }
  await loadLogs();
  await loadAutostart();
}

async function loadLogs() {
  try {
    const r = await api('/api/logs?tail=30');
    document.getElementById('logs').textContent = (r.lines || []).join('\n') || '（暂无日志）';
  } catch (e) { }
}

async function doLogin() {
  setMsg('正在认证…');
  try {
    const r = await api('/api/login', { method: 'POST' });
    setMsg(r.message, r.ok === true || r.ok === 'true');
    await refresh();
  } catch (e) {
    setMsg('请求失败: ' + e, false);
  }
}

async function saveCred() {
  const username = document.getElementById('user').value.trim();
  const password = document.getElementById('pass').value;
  const carrier = document.getElementById('carrier').value;
  if (!username || !password) { setMsg('账号和密码不能为空', false); return; }

  try {
    const r = await api('/api/cred', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, carrier })
    });
    setMsg(r.message, r.ok === true || r.ok === 'true');
    if (r.ok === true) { document.getElementById('pass').value = ''; await refresh(); }
  } catch (e) {
    setMsg('保存失败: ' + e, false);
  }
}

async function loadAutostart() {
  try {
    const r = await api('/api/autostart');
    autostartEnabled = !!r.enabled;
    document.getElementById('autoBtn').textContent = autostartEnabled ? '关闭开机自启' : '开启开机自启';
  } catch (e) { }
}

async function toggleAutostart() {
  try {
    const r = await api('/api/autostart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: !autostartEnabled })
    });
    setMsg(r.message, r.ok === true || r.ok === 'true');
    await loadAutostart();
  } catch (e) {
    setMsg('操作失败: ' + e, false);
  }
}

refresh();
setInterval(loadLogs, 5000);
</script>
</body>
</html>
